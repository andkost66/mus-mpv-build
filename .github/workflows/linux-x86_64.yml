name: Linux x86_64 mpv

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test
        run: ./linux-x86_64/build.sh

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          source linux-x86_64/source.env

          short_sha="${GITHUB_SHA:0:12}"

          archive="mpv-${MPV_VERSION}-linux-x86_64-rev.${short_sha}.tar.zst"
          tag="mpv-${MPV_VERSION}-rev.${short_sha}"

          tar \
              --directory dist \
              --create \
              --file - \
              bin lib |
              zstd \
                  -T0 \
                  -o "$archive"

          sha256sum "$archive" > "${archive}.sha256"

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          TAG: ${{ steps.package.outputs.tag }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail

          source linux-x86_64/source.env

          if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release already exists: $TAG" >&2
              exit 1
          fi

          gh release create \
              "$TAG" \
              "$ARCHIVE" \
              "${ARCHIVE}.sha256" \
              --target "$GITHUB_SHA" \
              --title "mpv ${MPV_VERSION} linux-x86_64 rev.${SHORT_SHA}" \
              --notes "mus mpv build revision ${GITHUB_SHA}"
