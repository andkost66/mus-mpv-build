name: Linux x86_64 mpv

on:
  pull_request:
    paths:
      - "build-config/**"
      - "builders/debian-11.Dockerfile"
      - "targets/linux-x86_64/**"
      - "scripts/**"
      - "fixtures/**"
      - ".github/workflows/linux-x86_64.yml"

  push:
    branches:
      - main
    paths:
      - "build-config/**"
      - "builders/debian-11.Dockerfile"
      - "targets/linux-x86_64/**"
      - "scripts/**"
      - "fixtures/**"
      - ".github/workflows/linux-x86_64.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils openssl python3 zstd

      - name: Provision portability images
        shell: bash
        run: |
          set -euo pipefail

          unset PORTABILITY_IMAGES DOCKER_PLATFORM
          source targets/linux-x86_64/target.env

          IFS=$' \t\n' read -r -a portability_images <<< "${PORTABILITY_IMAGES//$'\n'/ }"
          for image in "${portability_images[@]}"; do
              docker pull --platform "$DOCKER_PLATFORM" "$image"
          done

      - name: Build, package and verify linux-x86_64
        run: ./scripts/build-package-verify.sh linux-x86_64
